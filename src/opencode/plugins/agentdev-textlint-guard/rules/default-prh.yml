# ADF 標準 prh 辞書（一般文章の禁止表現）。
# 既存の禁止表現検出で用いていた一般文章用置換辞書（禁止表現区分）から
# 完全一致検出として移管した語を登録する。文脈で推奨訳が複数ある語は候補を「/」区切りで示す。
# 検出は散文（Str 節点）のみに適用され、inline code と fenced code は対象外。
version: 1
rules:
  # 中国語簡体字・中国語由来
  - expected: 〜ではなく
    pattern: 而非
  - expected: 統一
    pattern: 统一
  - expected: 記述形式/表明形式
    pattern: 陈述形式
  - expected: 候補
    pattern: 候选
  - expected: パス/経路
    pattern: 路径
  - expected: 出典/由来/発生元
    pattern: 来源
  # 文字化け・誤字・変換失敗
  - expected: 破綻
    pattern: 破綾
  - expected: 監査証跡
    pattern: 監査証跠
  - expected: 成果物
    pattern: 成果成果物
  - expected: 本来/件
    pattern: 本来件
  - expected: 進捗
    pattern: 進捰
  # 直訳独自語・英語混在
  - expected: 自己完結
    pattern: 自己完束
  - expected: 唯一の情報源（SSoT）
    # ハイフンを含む語は plain pattern の自動エスケープ（\-）が Unicode 正規表現で
    # 不正になるため、regex 形式で指定する
    pattern: /source-of-trought/
  # 確定誤字・別字形・中国語簡体字混入（docs 日本語品質是正 Case #3839 で残存 0 を実測確認）
  # 查読（→ 査読）は既知不備センチネル S-05 の検出対象語定義として docs 内に恒常残存するため未登録
  - expected: 候補
    pattern: 候選
  - expected: 追跡
    pattern: 追跠
  - expected: 下流
    pattern: 下遊
  - expected: 括弧
    pattern: 括号
  - expected: 移行
    pattern: 迁移
