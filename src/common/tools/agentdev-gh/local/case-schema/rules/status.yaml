# ローカルIssue status スキーマ（role 条件付き）
#
# 正本: docs/designs/local/local-case-file.md「role: tracking の条件付きスキーマ」「role: case の条件付きスキーマ」
# 要件: REQ-009-028
#
# role ごとの status 値域・終端状態・状態遷移を定義する。
# role: tracking の 6 状態と三段写像（GitHub open/closed、Tool issue_close reason
# の対応）の意味論の正は agentdev-issue-tracking Design が所有する。
# 本ファイルは docs/designs/local/local-case-file.md と矛盾してはならない。

schema_version: "2.0"
target: ".agentdev/issues/issue-{NNNN}.md の status フィールド"
canonical_spec: "docs/designs/local/local-case-file.md"

# role 条件付き status 値域
role_conditional_status:
  tracking:
    enum_ref: "#tracking_status_enum"
    description: "追跡Issue 6 状態（起票、検討中、保留、実行準備完了、解決済み、クローズ済み）"
  case:
    enum_ref: "#case_status_enum"
    description: "Case 実行 3 状態（実行継続中 / 完了 / 中止）"

# role: tracking の status 値域
tracking_status_enum:
  created:
    description: "起票。追跡Issue作成直後の初期状態"
    terminal: false
    github_state: open
  in-discussion:
    description: "検討中。検討経過（コメント相当履歴）が蓄積する状態"
    terminal: false
    github_state: open
  on-hold:
    description: "保留。現在判断できない理由と再評価条件を本文が保持する状態"
    terminal: false
    github_state: open
  ready:
    description: "実行準備完了。正規要件化・設計経路への引き継ぎ可能な状態"
    terminal: false
    github_state: open
  resolved:
    description: "解決済み。結論が確定し本文の解決結論が保持する中間状態（open を維持）"
    terminal: false
    github_state: open
  closed:
    description: "クローズ済み。必要な反映の完了または反映不要の確認完了"
    terminal: true
    github_state: closed
    close_reason:
      - completed
      - not_planned

# role: tracking の状態遷移
# 非終端状態間の遷移は追跡Issue操作（/agentdev/issue 相当）が指示に従って
# 実行する。終端状態への遷移は issue_close、終端からの復帰は issue_reopen のみ。
tracking_transitions:
  - operation: "追跡Issue起票"
    from: "(新規作成)"
    to: "created"
  - operation: "issue_update（trackingState 指定）"
    from: "created"
    to: "in-discussion | on-hold | ready | resolved"
  - operation: "issue_update（再評価・結論確定）"
    from: "on-hold"
    to: "in-discussion | on-hold | resolved"
  - operation: "issue_close"
    from: "created | in-discussion | on-hold | ready | resolved"
    to: "closed"
    note: "close reason は completed / not_planned のいずれも クローズ済み へ遷移する。理由の詳細はコメント相当履歴で保持する"
  - operation: "issue_reopen"
    from: "closed"
    to: "in-discussion"
    note: "クローズ済みからの再検討"

# role: case の status 値域
# Root Case の正規状態は実行継続、完了、中止を識別できる最小構成。
# blocked・failed は子 Issue の状態として Epic 実行構成が所有し、
# Root Case の status 値としては重複保持しない。
case_status_enum:
  active:
    description: "実行継続中（Root Case 確立から実行完了・中止確定まで。確定・準備・実行中・停止待機を含む）"
    terminal: false
  closed:
    description: "完了"
    terminal: true
  cancelled:
    description: "中止"
    terminal: true

# 終端状態（role ごと）
terminal_states:
  tracking:
    - closed
  case:
    - closed
    - cancelled

# role: case の状態遷移表
case_transitions:
  - operation: "ローカル版 case-open"
    from: "(新規作成)"
    to: "active"
  - operation: "ローカル版 case-ready / case-run / case-close の各処理"
    from: "active"
    to: "active"
    note: "継続。停止・待機の理由はコメント（停止理由）で表現する"
  - operation: "ローカル版 case-close 完了"
    from: "active"
    to: "closed"
  - operation: "明示中止"
    from: "active"
    to: "cancelled"

# 再開経路（role: case）
# 再開入口は Root Case 指定に共通とし、工程別の resume_command を使用しない。
# 経路解決は Root Case の正規状態、Epic 実行構成、既存成果物
# （ローカル Git 上の取り込み結果、draft、RU）、実行の生存状況の照合で行う。
recovery_paths:
  root_case_resume:
    description: "Root Case 指定による再開（経路解決は durable state の照合。resume_command は廃止）"
    path:
      - "active"

# 禁止遷移（role: case）
forbidden_transitions:
  - from: "active"
    to: "active 以外の非終端（3値では該当なし）"
    reason: "role: case の非終端状態は active のみ。実行契約の確定（case-ready）を経ない実装開始を行わない"
  - from: "closed"
    to: "*"
    reason: "終端状態からの遷移は定義しない（reopen を拒否する）"
  - from: "cancelled"
    to: "*"
    reason: "終端状態からの遷移は定義しない（reopen を拒否する）"
