# ローカルIssue labels スキーマ（role 条件付き）
#
# 正本: docs/designs/local/local-case-file.md「role: tracking の条件付きスキーマ」「labels 値域（role: case）」
# 要件: REQ-009-029
#
# role ごとの labels 値域を定義する。role: tracking の labels 値域は値域定義を持たない
# （原則空配列・通常ラベルの任意付与可）。role: tracking の kind 値の意味論の正は
# agentdev-issue-tracking Design が所有する。
# 本ファイルは docs/designs/local/local-case-file.md と矛盾してはならない。

schema_version: "2.0"
target: ".agentdev/issues/issue-{NNNN}.md の labels フィールド"
canonical_spec: "docs/designs/local/local-case-file.md"

# role 条件付き labels 値域
role_conditional_labels:
  tracking:
    constraint: "原則空配列。通常ラベルの任意付与可（付与するラベル値の選択は任意、起票時の既定付与は設けない）。値域の列挙拘束とラベル値域の機械検証は適用しない。kind は本文標準構造の kind 項目で表現し、ラベルでは表現しない"
  case:
    enum_ref: "#case_label_enum"
    constraint: "0 個以上を選定"

# role: case の labels 値域
case_label_enum:
  feature:
    description: "機能追加・新規開発"
  bugfix:
    description: "バグ修正"
  maintenance:
    description: "保守・運用改善"
  docs:
    description: "ドキュメント作成・更新"
  refactor:
    description: "リファクタリング・構造改善（振る舞い維持）"
  chore:
    description: "雑務・設定変更・依存更新"
  epic:
    description: "Epic（複数子 Case を束ねる親票）"

# ガードレール
constraints:
  - "role: case に対応する enum に存在しないラベルを追加してはならない（role: tracking は値域の列挙拘束と機械検証の適用外）"
  - "labels は配列として扱い、単一文字列としては扱わない"
  - "labels を状態遷移やワークフロー状態の代替として扱わない"
  - "role: tracking の labels 値域は原則空配列・通常ラベルの任意付与可（値域の列挙拘束と機械検証の適用外）。kind は本文標準構造の kind 項目で表現する"
