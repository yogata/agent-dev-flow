# ローカルIssue YAML 前書きスキーマ
#
# 正本: docs/designs/local/local-case-file.md「共通メタデータ（YAML 前書き）」
# 要件: REQ-009-026, REQ-009-027
#
# ローカルIssue (.agentdev/issues/issue-{NNNN}.md) の YAML 前書きに含める
# フィールドの型・必須/任意・値域を定義する。status と labels は role ごとの
# 値域を持つ（role 条件付きスキーマ）。
# 本ファイルは docs/designs/local/local-case-file.md と矛盾してはならない。

schema_version: "2.0"
target: ".agentdev/issues/issue-{NNNN}.md の YAML 前書き"
canonical_spec: "docs/designs/local/local-case-file.md"

# 必須フィールド（共通メタデータ）
fields:
  id:
    type: string
    required: true
    pattern: "^issue-[0-9]{4}$"
    constraint: "ファイル名 issue-{NNNN}.md の {NNNN} 部と一致すること"
    description: "ローカルIssue識別子。4 桁ゼロ埋め。role ごとに採番を分けない単一採番空間"
    examples:
      - "issue-0001"
      - "issue-0042"

  title:
    type: string
    required: true
    constraint: "自由記述。Issue の概要を簡潔に表す日本語または英語"
    description: "Issue のタイトル"

  role:
    type: string
    required: true
    enum:
      - tracking
      - case
    constraint: "tracking（追跡Issue）または case（Case Issue）。role の意味論は agentdev-issue-tracking Design が所有する"
    description: "Issue の論理 role。role ごとに status・labels の値域と許可操作が分岐する"

  status:
    type: string
    required: true
    enum_ref: "status.yaml#role_conditional_status"
    constraint: "role に対応する status.yaml の値域から選択"
    description: "Issue のライフサイクル状態（role 条件付き）"

  created_at:
    type: string
    required: true
    format: "ISO 8601 (日時)"
    constraint: "タイムゾーンオフセット付きを推奨"
    description: "Issue 作成日時"
    examples:
      - "2026-06-20T21:39:00+09:00"

  updated_at:
    type: string
    required: true
    format: "ISO 8601 (日時)"
    constraint: "最終更新日時。更新の都度書き換える"
    description: "Issue 最終更新日時"
    examples:
      - "2026-06-20T22:05:00+09:00"

  closed_at:
    type: string
    required: conditional
    format: "ISO 8601 (日時) または空文字列"
    condition: "role ごとの終端 status の場合のみ値を持つ。それ以外では空文字列またはフィールド値なし"
    description: "Issue 終端日時"
    examples:
      - "2026-06-21T10:00:00+09:00"
      - ""

  labels:
    type: array
    required: true
    items:
      type: string
      enum_ref: "labels.yaml#role_conditional_labels"
    constraint: "role に対応する labels.yaml の値域から選定。補助分類であり状態遷移やワークフロー状態の代替として扱わない"
    description: "Issue のラベル一覧（role 条件付き）"

# 禁止フィールド
# 以下のフィールドは YAML 前書きに含めてはならない。
forbidden_fields:
  - name: work_type
    reason: "前書きに持たせない"
  - name: source
    reason: "前書きに持たせない"
  - name: branch
    reason: "ブランチ情報は role: case の ## マージ結果 セクションに記録する"
  - name: base_branch
    reason: "ブランチ情報は role: case の ## マージ結果 セクションに記録する"

# closed_at の値条件（Design local-case-file.md「closed_at の値条件」）
closed_at_rules:
  - "role: tracking は status: closed の場合のみクローズ日時を ISO 8601 形式で記録する"
  - "role: case は status: closed（クローズ）または cancelled（キャンセル）の場合のみ値を持つ"
  - "それ以外の status: 空文字列またはフィールド値なし"
