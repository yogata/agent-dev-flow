# ローカルIssue status スキーマ（role 条件付き）
#
# 正本: docs/designs/local/local-case-file.md「role: tracking の条件付きスキーマ」「role: case の条件付きスキーマ」
# 要件: REQ-009-028
#
# role ごとの status 値域・終端状態・状態遷移を定義する。
# role: tracking の 6 状態と三段写像（GitHub open/closed、Tool issue_close reason
# の対応）の意味論の正は agentdev-issue-tracking Design が所有する。
# 本ファイルは docs/designs/local/local-case-file.md と矛盾してはならない。

schema_version: "2.0"
target: ".agentdev/issues/issue-{NNNN}.md の status フィールド"
canonical_spec: "docs/designs/local/local-case-file.md"

# role 条件付き status 値域
role_conditional_status:
  tracking:
    enum_ref: "#tracking_status_enum"
    description: "追跡Issue 6 状態（起票、検討中、保留、実行準備完了、解決済み、クローズ済み）"
  case:
    enum_ref: "#case_status_enum"
    description: "Case 実行 6 状態（旧ローカル Case ファイルから継承）"

# role: tracking の status 値域
tracking_status_enum:
  created:
    description: "起票。追跡Issue作成直後の初期状態"
    terminal: false
    github_state: open
  in-discussion:
    description: "検討中。検討経過（コメント相当履歴）が蓄積する状態"
    terminal: false
    github_state: open
  on-hold:
    description: "保留。現在判断できない理由と再評価条件を本文が保持する状態"
    terminal: false
    github_state: open
  ready:
    description: "実行準備完了。正規要件化・設計経路への引き継ぎ可能な状態"
    terminal: false
    github_state: open
  resolved:
    description: "解決済み。結論が確定し本文の解決結論が保持する中間状態（open を維持）"
    terminal: false
    github_state: open
  closed:
    description: "クローズ済み。必要な反映の完了または反映不要の確認完了"
    terminal: true
    github_state: closed
    close_reason:
      - completed
      - not_planned

# role: tracking の状態遷移
# 非終端状態間の遷移は追跡Issue操作（/agentdev/issue 相当）が指示に従って
# 実行する。終端状態への遷移は issue_close、終端からの復帰は issue_reopen のみ。
tracking_transitions:
  - operation: "追跡Issue起票"
    from: "(新規作成)"
    to: "created"
  - operation: "issue_update（trackingState 指定）"
    from: "created"
    to: "in-discussion | on-hold | ready | resolved"
  - operation: "issue_update（再評価・結論確定）"
    from: "on-hold"
    to: "in-discussion | on-hold | resolved"
  - operation: "issue_close"
    from: "created | in-discussion | on-hold | ready | resolved"
    to: "closed"
    note: "close reason は completed / not_planned のいずれも クローズ済み へ遷移する。理由の詳細はコメント相当履歴で保持する"
  - operation: "issue_reopen"
    from: "closed"
    to: "in-discussion"
    note: "クローズ済みからの再検討"

# role: case の status 値域
case_status_enum:
  open:
    description: "Case オープン済み、作業前"
    terminal: false
  running:
    description: "作業中"
    terminal: false
  blocked:
    description: "停止中（障害、未解決事項あり）"
    terminal: false
  review:
    description: "作業完了、レビュー対象"
    terminal: false
  closed:
    description: "完了"
    terminal: true
  cancelled:
    description: "中止"
    terminal: true

# 終端状態（role ごと）
terminal_states:
  tracking:
    - closed
  case:
    - closed
    - cancelled

# role: case の状態遷移表
case_transitions:
  - operation: "ローカル版 case-open"
    from: "(新規作成)"
    to: "open"
  - operation: "ローカル版 case-run 開始"
    from: "open"
    to: "running"
  - operation: "ローカル版 case-run 開始（再開）"
    from: "blocked"
    to: "running"
  - operation: "ローカル版 case-run 完了"
    from: "running"
    to: "review"
  - operation: "ローカル版 case-run 停止"
    from: "running"
    to: "blocked"
  - operation: "ローカル版 case-close 停止"
    from: "review"
    to: "blocked"
  - operation: "ローカル版 case-close 再開"
    from: "blocked"
    to: "review"
  - operation: "ローカル版 case-close 完了"
    from: "review"
    to: "closed"
  - operation: "ローカル版 case-close 取り込み失敗・未完了"
    from: "review"
    to: "blocked"
    note: "マージ結果セクションに失敗・未完了を記録し status を blocked へ更新する"
  - operation: "明示中止"
    from: "open | running | blocked | review"
    to: "cancelled"

# 再開経路（role: case）
recovery_paths:
  case_run:
    description: "ローカル版 case-run 停止後の再開経路"
    path:
      - "blocked"
      - "running"
      - "review"
  case_close:
    description: "ローカル版 case-close 停止後の再開経路"
    path:
      - "blocked"
      - "review"
      - "closed"

# 禁止遷移（role: case）
forbidden_transitions:
  - from: "blocked"
    to: "closed"
    reason: "blocked から closed への直接遷移は禁止。review を経由する"
  - from: "closed"
    to: "*"
    reason: "終端状態からの遷移は定義しない（issue_reopen の対象外）"
  - from: "cancelled"
    to: "*"
    reason: "終端状態からの遷移は定義しない（issue_reopen の対象外）"
