# ローカルIssue 本文見出しスキーマ（role 条件付き）
#
# 正本: docs/designs/local/local-case-file.md「本文構成（role: case）」「コメント読み替えの role 分岐」
# 要件: REQ-009-030
#
# role ごとの本文セクション見出しを定義する。role: tracking の本文標準構造
# （件名、背景、影響、関連成果物、選択肢、判断材料、不足情報、保留理由と再評価条件、
# 解決結論、反映先と反映状態、関連 Case Issue 参照）の正は agentdev-issue-tracking
# Design が所有する。
# 本ファイルは docs/designs/local/local-case-file.md と矛盾してはならない。

schema_version: "2.0"
target: ".agentdev/issues/issue-{NNNN}.md の本文見出し"
canonical_spec: "docs/designs/local/local-case-file.md"

role_conditional_headings:
  tracking:
    required: []
    comment_section: "## 検討経過"
    note: "Case 固有セクション（PR 相当セクション、マージ結果）を必須項目としない"
  case:
    required:
      - "## Design確定候補"
      - "## Findings / Capture候補"
    comment_section: "## 作業ログ"

# role: tracking のコメント相当セクション
# GitHub Issue コメント相当の検討経過を日時エントリの時系列で保持する。
# エントリ形式: `### {ISO 8601 日時}` 見出し + コメント本文。
tracking_comment_entries:
  heading_prefix: "### "
  timestamp_format: "ISO 8601"
  ordering: "時系列（追記型）"

# role: case の本文セクション一覧
case_headings:
  - number: 1
    heading: "## 入力"
    required: false
    role: "Case の入力情報（REQ パス、要件 doc パス、参照 Issue 等）"
  - number: 2
    heading: "## 背景"
    required: false
    role: "Case の背景説明"
  - number: 3
    heading: "## 問題"
    required: false
    role: "Case が解決する問題"
  - number: 4
    heading: "## 目的"
    required: false
    role: "Case の目的"
  - number: 5
    heading: "## 対象範囲"
    required: false
    role: "Case の対象範囲"
  - number: 6
    heading: "## 対象外"
    required: false
    role: "Case の対象外"
  - number: 7
    heading: "## 受け入れ条件"
    required: false
    role: "Case の受け入れ条件"
  - number: 8
    heading: "## 作業ログ"
    required: false
    role: "作業の進行ログ。GitHub Issue コメント相当の内容を記録"
  - number: 9
    heading: "## マージ前確認"
    required: false
    role: "マージ前確認事項。GitHub PR 本文の引き継ぎ情報の一部"
  - number: 10
    heading: "## Design確定候補"
    required: true
    role: "Design 確定候補。GitHub PR 本文が担っていた引き継ぎ情報の代替"
  - number: 11
    heading: "## Findings / Capture候補"
    required: true
    role: "Findings / Capture候補。下位に ### intake と ### learning サブ見出しを持つ"
    subheadings:
      - heading: "### intake"
        role: "intake 候補のリスト"
      - heading: "### learning"
        role: "learning 候補のリスト"
  - number: 12
    heading: "## マージ結果"
    required: false
    role: "ローカル Git 上の取り込み結果。ブランチ情報は本セクションに記録する（YAML 前書きには持たせない）"
  - number: 13
    heading: "## 残課題"
    required: false
    role: "残課題、フォローアップ項目"
  - number: 14
    heading: "## 完了判定"
    required: false
    role: "完了判定結果"
  - number: 15
    heading: "（自由拡張）"
    required: false
    role: "上記以外のセクションは必要に応じて追加可能"

# PR 系操作の対象（role: case のみ）
pr_operation_target:
  role: case
  note: "pr_create、pr_read、pr_merge、pr_changed_files、pr_mergeable の対象は role: case のローカルIssueに限る"
