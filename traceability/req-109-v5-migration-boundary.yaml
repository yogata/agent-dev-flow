component: req-109-v5-migration-boundary
# REQ-109(ADF v5 移行と互換性の境界)の implementation 対応。
# REQ-109 は判断・規範行群であり、判断面の正の恒久実体として DEC-056(判断記録・accepted)と
# design-principles.md「## 0. 実験前提の3原則(最上位ルール)」節(AGENTS.md が正規参照点とする
# 恒久規範)を宣言先とする。行ごとの担当確認:
#   - REQ-109-001: 3原則2(「後方互換性の完全破棄: 旧表記・旧パス・旧契約への移行補助層を
#     恒久資産として維持せず」)が互換性の恒久義務不存在を実現(DEC-056 決定の正規判断記録も同一趣旨)。
#   - REQ-109-002: 3原則1・2(「履歴性は Git 履歴で担保する」「移行補助層(crosswalk 等)を
#     恒久資産として維持せず」)が正規情報の Git 履歴読み出し確認と対照資産非依存を恒久化。
#   - REQ-109-004: 3原則1(実験・ロールバック許容・Git 履歴による復元)が移行元情報の
#     Git 履歴照合可能性を恒久化。
#   - REQ-109-005: DEC-056 本文が「検証に不充分・不明瞭がある場合は移行成功を宣言しない」を
#     正に宣言(3原則はこの趣旨を所有しないため DEC-056 を宣言先とする)。
#   - REQ-109-006: 3原則2(移行補助層の恒久維持を要件としない)が旧互換層の一律必須禁止を恒久化。
# design 対応は ra010-traceability-modernization.yaml(design-principles.md)が既存。
# 実体探索と担当確認は Case #4143・DEL-4143-1 で実施(2026-11-18)。
implementation:
  docs/decisions/DEC-056.md:
    - REQ-109-005
  docs/designs/foundations/design-principles.md:
    - REQ-109-001
    - REQ-109-002
    - REQ-109-004
    - REQ-109-006
