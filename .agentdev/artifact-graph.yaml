# AgentDevFlow self-hosting augmentation (REQ-012-009, Issue #1951)
#
# 標準スキル agentdev-artifact-graph の open extension point へ self-hosting 固有知識を追加する。
# 旧 repo-local repo-agentdev-artifact-graph と同等の探索能力を維持する。
#
# 追加内容:
#   node_types:     command, skill, integrity_rule, extension, source_file
#   relation_types: delegates_to, governs
#   indexed_paths:  src/opencode, .opencode, .agentdev/extensions, scripts, tests
#
# source_file は containment logic（nodes.ts / edges.ts）が全入力ファイルへ対してノードを生成する。
# path_pattern "a^" は不一致パターンであり、ルールベース抽出ではマッチしない。
#
# 拡張関係型の意味定義と source_file の役割宣言は TIM 語彙カタログ SPEC
# （docs/specs/foundations/traceability-model.md）の定める宣言様式に従う
# （「拡張関係型の意味定義様式」「索引・集約成果物の役割識別」、Issue #2204 で適用）。
# source_file 型はグラフモデル上の非正規ファイル層であり、README 等の索引・集約成果物は
# この層にのみ存在する。当該層を role: index として宣言し、高位問い合わせの探索経路から
# 除外する（REQ-040-008）。

node_types:
  - name: integrity_rule
    path_pattern: '^docs/specs/integrity/rules/(IR-\d+)[^/]*\.md$'
    id_template: 'integrity_rule:{match1}'
    label_source:
      - kind: frontmatter_field
        field: title
      - kind: first_heading
      - kind: filename_stem
    extraction_rule: frontmatter

  - name: command
    path_pattern: '^src/opencode/commands/agentdev/(?!README\.)([^/]+)\.md$'
    id_template: 'command:{match1}'
    label_source:
      - kind: path_group
        group: 1
    extraction_rule: frontmatter

  - name: skill
    path_pattern: '^(?:src/opencode|\.opencode)/skills/([^/]+)/SKILL\.md$'
    id_template: 'skill:{match1}'
    label_source:
      - kind: frontmatter_field
        field: name
      - kind: path_group
        group: 1
    extraction_rule: frontmatter

  - name: extension
    path_pattern: '^\.agentdev/extensions/[^/]+/[^/]+\.ya?ml$'
    id_template: 'extension:{path}'
    label_source:
      - kind: path
    extraction_rule: extension_field

  - name: source_file
    path_pattern: 'a^'
    id_template: 'source_file:{path}'
    label_source:
      - kind: path
    extraction_rule: filesystem
    role: index

relation_types:
  - name: delegates_to
    fields:
      - delegates_to
      - rules.skill
      - checks.skill
    reverse_direction: false
    semantics:
      meaning: リンク元が処理の一部をリンク先へ委譲する
      semantics_slot: depend
      change_impact_direction: backward
      standard_vocabulary: []

  - name: governs
    fields:
      - related_req
      - related_spec
      - governed_by
    reverse_direction: false
    semantics:
      meaning: リンク元がリンク先の内容または品質を統治する
      change_impact_direction: forward
      standard_vocabulary: []

indexed_paths:
  - src/opencode
  - .opencode
  - .agentdev/extensions
  - scripts
  - tests
