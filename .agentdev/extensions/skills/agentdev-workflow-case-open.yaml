# ADF-COVERS(implementation): REQ-098-001, REQ-098-002, REQ-098-003, REQ-098-004, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-open

context:
  - id: must-1
    paths:
      - "docs/designs/commands/case-ready.md"
    purpose: Epic/Wave/Issue 実行モデルと連結成分ベース構成生成の確認
  - id: v4-lifecycle-state-machine
    when: ワークフロー契約（フェーズ、SSoT 遷移）参照時
    paths:
      - "docs/designs/workflows/v4-lifecycle-state-machine.md"
    purpose: パイプライン概要と共通フェーズ契約の確認
  - id: req-define-test-strategy
    when: "req-define のテスト戦略セクション参照時"
    paths:
      - "docs/designs/commands/req-define.md"
    purpose: Issue 本文の test strategy 項目構造の確認
  - id: integration-target-and-experiment-case
    when: 統合先と実証Caseの Issue 構成（統合先記録、実証Case識別情報、評価契約投影、統合先同期確認）参照時
    paths:
      - "docs/designs/commands/case-open.md"
    purpose: 統合先と実証CaseのIssue構成セクションの実行詳細確認

rules:
  - id: yomiyasu-application-before-write
    when: >-
      docs/** の日本語文章を変更する場合と、GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル経由の書込みを含む）を agentdev_gh へ渡す場合に適用する。yomiyasu 推敲の適用手順（編集前読込、推敲タイミング、同梱 lint の実行経路）、適用済みの判定、停止条件、記録様式、推敲の保護条件、書込み guard の拒否対象・許可対象と拒否後の回復（迂回禁止）の規律は、`agentdev-workflow-lifecycle` スキル「文章品質・書込み規約」節を正本として参照する。規則本文を複製しない。Definition 文章の編集前読込と提出前の推敲・lintを含む
    skill: yomiyasu

checks: []

acceptance_gates: []

must_not: []
