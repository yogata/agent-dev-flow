version: 1
kind: workflow-extension
id: agentdev-workflow-case-open

context:
  - id: must-1
    paths:
      - "docs/designs/workflows/epic-wave-model.md"
    purpose: Epic/Wave/Issue 実行モデルと連結成分ベース構成生成の確認
  - id: workflow-contracts
    when: ワークフロー契約（フェーズ、SSoT 遷移）参照時
    paths:
      - "docs/designs/workflows/workflow-contracts.md"
    purpose: パイプライン概要と共通フェーズ契約の確認
  - id: req-define-test-strategy
    when: "req-define のテスト戦略セクション参照時"
    paths:
      - "docs/designs/commands/req-define.md"
    purpose: Issue 本文の test strategy 項目構造の確認
  - id: integration-target-and-experiment-case
    when: 統合先と実証Caseの Issue 構成（統合先記録、実証Case識別情報、評価契約投影、統合先同期確認）参照時
    paths:
      - "docs/designs/commands/case-open.md"
    purpose: 統合先と実証CaseのIssue構成セクションの実行詳細確認

rules:
  - id: artifact-graph-impact-candidates
    when: 起点成果物から変更影響、廃止参照、未解決参照の候補を探索するとき。利用不能時は従来の探索手段で続行する
    skill: agentdev-artifact-graph

checks: []

acceptance_gates: []

must_not: []
