version: 1
kind: workflow-extension
id: agentdev-workflow-case-run

context:
  - id: must-1
    paths:
      - "docs/designs/workflows/epic-wave-model.md"
    purpose: Epic/Wave/Issue 実行モデルと子Issue 並列委譲の確認
  - id: workflow-contracts
    when: ワークフロー契約（フェーズ、SSoT 遷移、実装分類）参照時
    paths:
      - "docs/designs/workflows/workflow-contracts.md"
    purpose: "case-run 3フェーズ構成と自律修正ループ契約の確認"

rules:
  - id: traceability-check-before-pr
    when: 対象要件の対応関係確認と PR 作成前の対応宣言整合性検査（check）を実施するとき。利用不能時は README 索引、正規成果物の直接読取、rg 等の独立探索手段で続行する
    skill: agentdev-traceability

checks: []

acceptance_gates:
  - PR 対象ファイルに src/opencode/commands/** または src/opencode/skills/** の変更を含む場合、当該変更ファイルが配布物参照境界（IR-059）に違反しないこと

must_not: []
