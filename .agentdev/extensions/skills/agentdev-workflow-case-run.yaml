# ADF-COVERS(implementation): REQ-098-001, REQ-098-002, REQ-098-003, REQ-098-004, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-run

context:
  - id: must-1
    paths:
      - "docs/designs/commands/case-run.md"
    purpose: Epic/Wave/Issue 実行モデルと子Issue 並列委譲の確認
  - id: v4-lifecycle-state-machine
    when: ワークフロー契約（フェーズ、SSoT 遷移、実装分類）参照時
    paths:
      - "docs/designs/workflows/v4-lifecycle-state-machine.md"
    purpose: "case-run 3フェーズ構成と自律修正ループ契約の確認"

rules:
  - id: traceability-check-before-pr
    when: 対象要件の対応関係確認と PR 作成前の対応宣言整合性検査（check）を実施するとき。利用不能時は README 索引、正規成果物の直接読取、rg 等の独立探索手段で続行する
    skill: agentdev-traceability
  - id: yomiyasu-application-before-write
    when: >-
      docs/** の日本語文章を変更する場合と、GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル経由の書込みを含む）を agentdev_gh へ渡す場合に適用する。yomiyasu 推敲の適用手順（編集前読込、推敲タイミング、同梱 lint の実行経路）、適用済みの判定、停止条件、記録様式、推敲の保護条件、書込み guard の拒否対象・許可対象と拒否後の回復（迂回禁止）の規律は、`agentdev-workflow-lifecycle` スキル「文章品質・書込み規約」節を正本として参照する。規則本文を複製しない。実装に伴う docs 変更への適用と、実行担当サブエージェント委譲への適用義務の引継ぎを含む
    skill: yomiyasu

checks: []

acceptance_gates:
  - PR 対象ファイルに src/opencode/commands/** または src/opencode/skills/** の変更を含む場合、当該変更ファイルが配布物参照境界（IR-059）に違反しないこと

must_not: []
