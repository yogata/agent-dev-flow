# ADF-COVERS(implementation): REQ-098-001, REQ-098-002, REQ-098-003, REQ-098-004, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-close

context:
  - id: must-1
    paths:
      - "docs/designs/foundations/document-model.md"
    purpose: "REQ/Decision/Design/guides の責務マトリックスと文書間関係の確認（document-model Design）"
  - id: case-auto-conflict-model
    when: "case-auto 並行実行時のコンフリクト解消モデル参照時"
    paths:
      - "docs/designs/commands/case-auto.md"
    purpose: "case-auto 連携時のコンフリクト解消手順の確認"
  - id: case-close-spec
    when: "case-close 工程 Design 参照時"
    paths:
      - "docs/designs/commands/case-close.md"
    purpose: "case-close の完了ゲート、QG-4 達成判定、統合先へのマージと実証最終クローズの実行詳細の確認"
  - id: index-auto-generation-spec
    when: "Step 3-3 AUTOGEN block 索引再生成差分検出（単一 Issue / Epic Wave E5b 前段）参照時"
    paths:
      - "docs/designs/integrity/index-auto-generation.md"
    purpose: "AUTOGEN block 自動生成機構と generate_indexes.ts の契約確認"
  - id: discovery-2
    purpose: docs/designs/README.md 経由で Design status と整合性ルールカタログを参照してよい
  - id: discovery-3
    purpose: "docs/designs/integrity/integrity-rule-catalog.md 経由で関連 IR を確認してよい"

rules:
  - id: traceability-qg4-independent-recheck
    when: QG-4 で対象要件の実装対応・検証対応の完全性を独立して再検査するとき。利用不能時は既存の品質ゲート、targeted docs guard、rg 等の従来の検査手段で続行する
    skill: agentdev-traceability
  - id: yomiyasu-application-before-write
    when: >-
      docs/** 日本語文章を変更する場合: 編集前に yomiyasu を読み込み、内容変更が揃った後に変更文章と周辺文脈を推敲し、同梱 lint（.opencode/skills/yomiyasu/scripts/yomiyasu_lint.py を環境で利用可能な Python コマンド〔python3 に固定しない〕で標準入力により実行し、検査専用の本文ファイルを新規保存しない）を実行して指摘を確認する。各 edit ごと・既存文書全体の一括推敲は不要

      GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル〔agentdev-issue-management、agentdev-workflow-templates、agentdev-epic-tracker、agentdev-quality-gates、agentdev-case-run-execution-adapter〕経由の書込みを含む）は agentdev_gh へ渡す前に推敲する。本文は lint・指摘確認後、タイトルは本文向け文長・箇条書き比率を合否条件にしない。書込み後 VERIFY は維持

      更新は変更文章と周辺文脈を対象とし、他者の文章・引用・ログを無断でリライトしない。ラベル・状態・チェックボックスのみの変更は再推敲不要

      要件の必須性・条件・責任主体・数値・否定条件を保持し、識別子・リンク・コード・引用・固定テンプレート・表構造・AUTOGEN 部分を保護する。既存用語辞書・文書契約を優先し、機械的な箇条書き削減・否定対比の肯定化を適用しない

      適用済みは推敲・lint・指摘確認までを指す（修正不要の確認を含む）。警告ゼロ・スコア閾値・--strict を要求せず、lint の通常終了コード 0 を指摘なし・推敲済みの証明として扱わない。正当な用語への指摘は理由を記録して保持できる。修正試行は最大 2 回

      yomiyasu 未導入・lint 実行失敗の場合は対象文章の提出・投稿・マージを停止する。適用確認は最後の文章変更後に行い、親セッションの読込事実のみで委譲先の適用を省略しない

      記録は既存 PR 検証欄等へ対象・実施結果・保持した指摘理由を最小限残し、記録のためだけの再帰的コメント投稿や追加永続管理を作らない

      実装 PR のマージ前に適用を確認し、不足時は case-run へ差し戻す
    skill: yomiyasu

checks:
  - id: autogen-index-regeneration-diff
    when: "Step 3-3（単一 Issue クローズ）および Step E5b 前段（Epic Wave クローズ）。generate_indexes.ts --dry-run で AUTOGEN block 再生成差分を検出する。差分あり（WOULD UPDATE 行を含む）場合は case-close を停止し case-run へ差戻す（再生成の実 commit は case-run が行う）。差分なしの場合のみ case-close を完了する。case-close 自身は索引ファイルを直接編集・commit しない。契約の詳細は case-close Design Step 3-3 参照"
    skill: repo-agentdev-integrity

acceptance_gates:
  - 完了した Issue/PR の成果物が docs/requirements/, docs/decisions/, docs/designs/ のいずれかに存在すること
  - PR 対象ファイルに src/opencode/commands/** または src/opencode/skills/** の変更を含む場合、当該変更ファイルが配布物参照境界（IR-059）に違反しないこと
  - 実装 PR の差分に docs/** の日本語文章変更を含む場合、当該変更文章への yomiyasu 適用記録が PR 上に存在すること。不足時は case-run へ差し戻すこと

must_not: []
