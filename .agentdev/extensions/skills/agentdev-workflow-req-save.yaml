version: 1
kind: workflow-extension
id: agentdev-workflow-req-save

context:
  - id: must-1
    paths:
      - "docs/designs/foundations/document-model.md"
    purpose: REQ/Decision/Design の責務マトリックスと文書間関係の確認
  - id: integrity-rule-catalog
    when: 整合性ルールカタログ参照時
    paths:
      - "docs/designs/integrity/integrity-rule-catalog.md"
    purpose: REQ 保存後に影響する整合性ルールの確認
  - id: req-file-manager-procedure
    when: REQ ファイル管理手順参照時
    paths:
      - "docs/designs/skills/agentdev-req-file-manager.md"
    purpose: REQ 番号採番ルールと frontmatter 規約の確認
  - id: discovery-1
    purpose: "docs/designs/README.md 経由で関連 Design と Decision を探索してよい"
  - id: discovery-2
    purpose: docs/requirements/README.md 経由で REQ インデックスを確認してよい

rules: []

checks: []

acceptance_gates:
  - 保存した REQ/Decision が docs/requirements/, docs/decisions/ のインデックスに存在すること

must_not: []
