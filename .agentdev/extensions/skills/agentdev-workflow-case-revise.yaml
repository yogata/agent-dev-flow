# ADF-COVERS(implementation): REQ-098-001, REQ-098-002, REQ-098-003, REQ-098-004, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-revise

context:
  - id: case-ready-design
    paths:
      - "docs/designs/commands/case-ready.md"
    purpose: Definition Amendment の保存・確定境界の確認
  - id: v4-lifecycle-state-machine
    paths:
      - "docs/designs/workflows/v4-lifecycle-state-machine.md"
    purpose: 再合意済み変更後の case-ready 接続の確認
  - id: case-revise-spec
    paths:
      - "docs/designs/commands/case-revise.md"
    purpose: case-revise 固有の実行契約と停止境界の確認

rules:
  - id: yomiyasu-application-before-write
    when: >-
      docs/** の日本語文章を変更する場合と、GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル経由の書込みを含む）を agentdev_gh へ渡す場合に適用する。yomiyasu 推敲の適用手順（編集前読込、推敲タイミング、同梱 lint の実行経路）、適用済みの判定、停止条件、記録様式、推敲の保護条件、書込み guard の拒否対象・許可対象と拒否後の回復（迂回禁止）の規律は、`agentdev-workflow-lifecycle` スキル「文章品質・書込み規約」節を正本として参照する。規則本文を複製しない。再合意済み Definition 変更（Amendment PR・Case 関連 Issue 本文更新）への適用を含む
    skill: yomiyasu
checks: []
acceptance_gates:
  - 再合意済み Definition 変更が Amendment として既存 Root Case に関連付けられていること
  - case-revise 完了後に case-ready が再確定工程として実行可能であること
must_not: []
