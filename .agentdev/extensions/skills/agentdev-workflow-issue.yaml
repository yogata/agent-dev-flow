# ADF-COVERS(implementation): REQ-098-001, REQ-098-003, REQ-098-004, REQ-098-005, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-issue

context: []

rules:
  - id: yomiyasu-application-before-write
    when: >-
      docs/** の日本語文章を変更する場合と、GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル経由の書込みを含む）を agentdev_gh へ渡す場合に適用する。yomiyasu 推敲の適用手順（編集前読込、推敲タイミング、同梱 lint の実行経路）、適用済みの判定、停止条件、記録様式、推敲の保護条件、書込み guard の拒否対象・許可対象と拒否後の回復（迂回禁止）の規律は、`agentdev-workflow-lifecycle` スキル「文章品質・書込み規約」節を正本として参照する。規則本文を複製しない。追跡Issue の起票・更新・クローズ・再オープン・経過コメントの文章が対象
    skill: yomiyasu

checks: []

acceptance_gates: []

must_not: []
