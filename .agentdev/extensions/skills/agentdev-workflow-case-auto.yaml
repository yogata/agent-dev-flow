# ADF-COVERS(implementation): REQ-098-001, REQ-098-003, REQ-098-004, REQ-098-005, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-auto

context:
  - id: must-1
    paths:
      - "docs/designs/commands/case-auto.md"
    purpose: Epic/Wave/Issue 実行モデルと execution_unit 構成の確認
  - id: v4-lifecycle-state-machine
    when: ワークフロー契約（フェーズ、SSoT 遷移、実装分類）参照時
    paths:
      - "docs/designs/workflows/v4-lifecycle-state-machine.md"
    purpose: パイプライン概要と共通フェーズ契約の確認
  - id: case-auto-spec
    when: 本コマンド Design（adversarial-review 由来の停止伝播契約、bounded parent decision resolution、コンフリクト解消モデル3レベル、停止理由分類の分類軸、実証Case自走）参照時
    paths:
      - "docs/designs/commands/case-auto.md"
    purpose: case-auto 固有契約の正規定義の確認。本コマンド定義は実行入口であり、契約の詳細は本 Design を正とする
  - id: bounded-parent-decision-resolution-contract
    when: bounded parent decision resolution の解決範囲、作業仮定の明示要件、上位合意矛盾・新規ユーザー判断事項の停止理由分類、resume 機構の参照時
    paths:
      - "docs/requirements/REQ-034.md"
      - "docs/decisions/DEC-008.md"
    purpose: decision_context 自律解決境界の正規契約（REQ-034-032〜034、DEC-008 決定1〜6）の確認
  - id: adversarial-review-caller-contract
    when: adversarial-review 由来の停止伝播（case-auto の停止伝播受領）、user-decision-required の位置づけ、再 review 条件、default-on + skip policy の参照時
    paths:
      - "docs/requirements/REQ-014.md"
      - "docs/requirements/REQ-015.md"
    purpose: adversarial-review caller integration 契約（REQ-014-007/008/009/010/011/012、REQ-015-002/006/012）の確認

rules:
  - id: yomiyasu-application-before-write
    when: >-
      docs/** 日本語文章を変更する場合: 編集前に yomiyasu を読み込み、内容変更が揃った後に変更文章と周辺文脈を推敲し、同梱 lint（.opencode/skills/yomiyasu/scripts/yomiyasu_lint.py を環境で利用可能な Python コマンド〔python3 に固定しない〕で実行する。標準入力・パイプ・リダイレクト経由の本文渡しは使わず、検査専用本文ファイルを非永続領域〔一時ディレクトリ等のリポジトリ外〕に新規作成して lint のファイル引数実行を行い、検査後に当該ファイルを削除する〔Windows 環境ではパイプ・リダイレクト経由の本文渡しが文字コード再符号化により本文を破損し得るための代替経路〕）を実行して指摘を確認する。各 edit ごと・既存文書全体の一括推敲は不要

      GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル〔agentdev-issue-management、agentdev-workflow-templates、agentdev-epic-tracker、agentdev-quality-gates、agentdev-case-run-execution-adapter〕経由の書込みを含む）は agentdev_gh へ渡す前に推敲する。本文は lint・指摘確認後、タイトルは本文向け文長・箇条書き比率を合否条件にしない。書込み後 VERIFY は維持

      更新は変更文章と周辺文脈を対象とし、他者の文章・引用・ログを無断でリライトしない。ラベル・状態・チェックボックスのみの変更は再推敲不要

      要件の必須性・条件・責任主体・数値・否定条件を保持し、識別子・リンク・コード・引用・固定テンプレート・表構造・AUTOGEN 部分を保護する。既存用語辞書・文書契約を優先し、機械的な箇条書き削減・否定対比の肯定化を適用しない

      適用済みは推敲・lint・指摘確認までを指す（修正不要の確認を含む）。警告ゼロ・スコア閾値・--strict を要求せず、lint の通常終了コード 0 を指摘なし・推敲済みの証明として扱わない。正当な用語への指摘は理由を記録して保持できる。修正試行は最大 2 回

      yomiyasu 未導入・lint 実行失敗の場合は対象文章の提出・投稿・マージを停止する。適用確認は最後の文章変更後に行い、親セッションの読込事実のみで委譲先の適用を省略しない

      記録は既存 PR 検証欄等へ対象・実施結果・保持した指摘理由を最小限残し、記録のためだけの再帰的コメント投稿や追加永続管理を作らない

      委譲起動時に本適用義務を下位 workflow へ引き継ぐ（正規適用点は各下位 workflow の extension）。orchestration 回復時の PR 作成代行文章にも適用する
    skill: yomiyasu

checks: []

acceptance_gates: []

must_not: []
