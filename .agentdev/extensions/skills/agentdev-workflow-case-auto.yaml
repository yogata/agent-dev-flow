# ADF-COVERS(implementation): REQ-098-001, REQ-098-003, REQ-098-004, REQ-098-005, REQ-098-006, REQ-098-008
version: 1
kind: workflow-extension
id: agentdev-workflow-case-auto

context:
  - id: must-1
    paths:
      - "docs/designs/commands/case-auto.md"
    purpose: Epic/Wave/Issue 実行モデルと execution_unit 構成の確認
  - id: v4-lifecycle-state-machine
    when: ワークフロー契約（フェーズ、SSoT 遷移、実装分類）参照時
    paths:
      - "docs/designs/workflows/v4-lifecycle-state-machine.md"
    purpose: パイプライン概要と共通フェーズ契約の確認
  - id: case-auto-spec
    when: 本コマンド Design（adversarial-review 由来の停止伝播契約、bounded parent decision resolution、コンフリクト解消モデル3レベル、停止理由分類の分類軸、実証Case自走）参照時
    paths:
      - "docs/designs/commands/case-auto.md"
    purpose: case-auto 固有契約の正規定義の確認。本コマンド定義は実行入口であり、契約の詳細は本 Design を正とする
  - id: bounded-parent-decision-resolution-contract
    when: bounded parent decision resolution の解決範囲、作業仮定の明示要件、上位合意矛盾・新規ユーザー判断事項の停止理由分類、resume 機構の参照時
    paths:
      - "docs/requirements/REQ-034.md"
      - "docs/decisions/DEC-008.md"
    purpose: decision_context 自律解決境界の正規契約（REQ-034-032〜034、DEC-008 決定1〜6）の確認
  - id: adversarial-review-caller-contract
    when: adversarial-review 由来の停止伝播（case-auto の停止伝播受領）、user-decision-required の位置づけ、再 review 条件、default-on + skip policy の参照時
    paths:
      - "docs/requirements/REQ-014.md"
      - "docs/requirements/REQ-015.md"
    purpose: adversarial-review caller integration 契約（REQ-014-007/008/009/010/011/012、REQ-015-002/006/012）の確認

rules:
  - id: yomiyasu-application-before-write
    when: >-
      docs/** の日本語文章を変更する場合と、GitHub 文章（Issue/PR タイトル・本文、説明・レビュー・完了コメント。委譲先能力スキル経由の書込みを含む）を agentdev_gh へ渡す場合に適用する。yomiyasu 推敲の適用手順（編集前読込、推敲タイミング、同梱 lint の実行経路）、適用済みの判定、停止条件、記録様式、推敲の保護条件、書込み guard の拒否対象・許可対象と拒否後の回復（迂回禁止）の規律は、`agentdev-workflow-lifecycle` スキル「文章品質・書込み規約」節を正本として参照する。規則本文を複製しない。委譲起動時に本適用義務を下位 workflow へ引き継ぐ（正規適用点は各下位 workflow の extension）。orchestration 回復時の PR 作成代行文章にも適用する
    skill: yomiyasu

checks: []

acceptance_gates: []

must_not: []
