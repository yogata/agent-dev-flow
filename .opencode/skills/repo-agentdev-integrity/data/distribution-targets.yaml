# distribution-targets.yaml
#
# Detection-view derived from docs/designs/local/runtime-package-boundary.md per
# Phase 3 §6.3 of cross-cutting-integration-design-20260811.md.
#
# Canonical source (Design is authoritative; this YAML is a detection view):
#   - docs/designs/local/runtime-package-boundary.md
#
# Consumed by:
#   - lib/distribution-boundary-rules.ts (single-path canonical load,
#     REQ-047-009: the checker loads IR-046/047/048 detection signals from
#     this YAML via loadDistributionTargets and fails closed when this file
#     is missing or malformed)
#
# Phase 5 (OU-006 #2082) implementation. IR-059 (existing distribution-
# reference-boundary) continues to own concrete-id/path/url detection; this
# view adds repository-kind, link-target directory, and generated_by checks.

schema_version: 1
generated_at: 2026-08-11
canonical_source: docs/designs/local/runtime-package-boundary.md

# IR-046 (consumer-generated repo type false-positive prevention): consumer
# installation must not generate artifacts that look like self-hosting repo
# files. The detector verifies that install-consumer-opencode.ps1 outputs do
# not leak self-hosting-only markers.
repo_kind_rules:
  description: |
    Repository kind (consumer vs self-hosting) classification signals.
    Consumer-generated trees must not contain self-hosting-only markers
    (e.g., `.agentdev-plugin/` self-reference, `scripts/install-consumer-*`
    inside consumer tree).
  self_hosting_only_paths:
    - scripts/install-consumer-opencode.ps1
    - scripts/check-consumer-opencode.ps1
    - .agentdev-plugin
  self_hosting_only_markers:
    - "AgentDevFlow プラグインの設定を管理するリポジトリ"

# IR-047 (src/opencode-local/ link target origin directory structure):
# `src/opencode-local/` (local-mode link target) must mirror the origin
# directory structure of `src/opencode/`. Only `agentdev-gh-cli/` is permitted
# under `src/opencode-local/` per DEC-004 local mode.
link_target_structure_rules:
  description: |
    src/opencode-local/ is a link-mode projection that mirrors the structure
    of src/opencode/. Per DEC-004, only `agentdev-gh-cli/` is projected into
    src/opencode-local/ for local mode.
  origin_dir: src/opencode
  link_dir: src/opencode-local
  allowed_link_subdirs:
    - agentdev-gh-cli

# IR-048 (generated_by identifier integrity): artifacts generated by
# install-consumer-opencode.ps1 must carry accurate `generated_by` markers.
# The detector verifies that generated artifacts declare the producer script
# and do not claim to be hand-maintained when they are mechanically produced.
generated_by_identifier_rules:
  description: |
    Mechanically generated artifacts must declare a `generated_by` marker
    consistent with the producer script. Hand-maintained artifacts must not
    claim mechanical origin.
  producer_script: scripts/install-consumer-opencode.ps1
  expected_marker_prefix: "generated_by:"
  forbidden_mismatch:
    # Hand-maintained file claiming to be generated, or generated file
    # missing the marker entirely. The detector verifies marker presence on
    # known generated artifact kinds.
    - artifact_kind: command_dir_index
      path_in_consumer: .opencode/commands/agentdev/README.md
      must_contain_marker: false  # commands README is hand-maintained in self-hosting
